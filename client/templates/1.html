<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDB Manager • 登录 / 注册</title>

<style>
    /* -------- iOS glassy login form -------- */
    @font-face {
        font-family: "SF Pro";
        src: url("https://cdn.jsdelivr.net/gh/apple/swift-org-website/fonts/SF-Pro-Display-Regular.woff2") format("woff2");
        font-display: swap;
    }

    :root {
        --accent: #007aff;
        --glass-bg: rgba(255, 255, 255, .65);
        --glass-brd: rgba(255, 255, 255, .25);
    }

    * {
        box-sizing: border-box;
        font-family: "SF Pro", -apple-system, system-ui, Roboto, Segoe UI, "Helvetica Neue", Helvetica, "PingFang SC", sans-serif
    }

    html, body {
        height: 100%;
        margin: 0
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, #cfd9ff 0%, #e2e8ff 50%, #f9fcff 100%) fixed;
    }

    .card {
        width: min(420px, 90%);
        padding: 3.5rem 2.75rem;
        border-radius: 1.4rem;
        background: var(--glass-bg);
        border: 1px solid var(--glass-brd);
        backdrop-filter: blur(30px) saturate(180%);
        box-shadow: 0 25px 45px rgba(0, 0, 0, .15);
        animation: rise .6s ease;
    }

    h1 {
        margin: 0 0 1.8rem;
        font-size: 1.9rem;
        font-weight: 650;
        text-align: center;
        color: #111
    }

    label {
        display: block;
        margin: .85rem 0 .25rem;
        font-size: .95rem;
        color: #555
    }

    input {
        width: 100%;
        padding: .8rem 1rem;
        border: 1px solid rgba(0, 0, 0, .08);
        border-radius: .8rem;
        background: #fff;
        font-size: 1.02rem;
        transition: border-color .2s;
    }

    input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(0, 122, 255, .25)
    }

    button {
        width: 100%;
        margin-top: 2rem;
        padding: .9rem;
        border: none;
        border-radius: .9rem;
        background: var(--accent);
        color: #fff;
        font-size: 1.07rem;
        font-weight: 600;
        transition: all .25s;
        cursor: pointer;
    }

    button:active {
        transform: scale(.98)
    }

    .switcher {
        margin-top: 1.7rem;
        text-align: center;
        font-size: .9rem;
        color: #007aff;
        cursor: pointer;
        user-select: none;
    }

    #error {
        color: #ff3b30;
        text-align: center;
        margin-top: 1rem;
        min-height: 1.2rem
    }

    @keyframes rise {
        from {
            opacity: 0;
            transform: translateY(18px)
        }
        to {
            opacity: 1;
            transform: none
        }
    }
</style>

<body>
<div class="card">
    <h1 id="title">登录到 PDB Manager</h1>
    <form id="form">
        <label>用户名</label>
        <input id="username" name="username" required autocomplete="username">
        <label>密码</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
        <button id="submitBtn">登录</button>
        <div id="error"></div>
    </form>
    <div class="switcher" id="switcher">没有账号？立即注册</div>
</div>

<script>
    /* -------- login / register logic -------- */
    const MODE = {login: "login", register: "register"};
    let cur = MODE.login;
    const $ = id => document.getElementById(id),
        title = $("title"), switcher = $("switcher"),
        submit = $("submitBtn"), form = $("form"), err = $("error");

    switcher.onclick = () => setMode(cur === MODE.login ? MODE.register : MODE.login);

    function setMode(m) {
        cur = m;
        const isLogin = m === MODE.login;
        $("title").textContent = isLogin ? "登录到 PDB Manager" : "注册新账号";
        submit.textContent = isLogin ? "登录" : "注册";
        switcher.textContent = isLogin ? "没有账号？立即注册" : "已有账号？返回登录";
        err.textContent = "";
    }

    form.onsubmit = async e => {
        e.preventDefault();
        err.textContent = "";
        const fd = new FormData(form);
        const res = await fetch("/api/" + cur, {method: "POST", body: fd});
        const j = await res.json();
        if (!res.ok) {
            err.textContent = j.detail;
            return
        }
        localStorage.token = j.token;
        location.href = "/dashboard";
    };
    if (localStorage.token) location.href = "/dashboard";
</script>
</body>
</html>
